const { useState, useEffect, useMemo, useRef, useCallback } = React;
const RF = window.ReactFlow || {};

// ═══ Error Boundary ═══
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error('Tobis OS Error:', error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{padding:'40px', color:'#E5E5E5', background:'#0A0A0A', minHeight:'100vh', fontFamily:'monospace'}}>
          <h1 style={{color:'#EF4444', fontSize:'24px', marginBottom:'16px'}}>⚠️ 오류 발생</h1>
          <div style={{padding:'16px', background:'#1F2937', borderRadius:'8px', whiteSpace:'pre-wrap', fontSize:'12px'}}>
            {String(this.state.error?.message || this.state.error || '알 수 없음')}
          </div>
          <div style={{marginTop:'16px', display:'flex', gap:'8px'}}>
            <button onClick={()=>window.location.reload()} style={{padding:'8px 16px', background:'#EA580C', border:'none', color:'white', borderRadius:'4px', cursor:'pointer'}}>🔄 새로고침</button>
            <button onClick={()=>{ if (confirm('모든 데이터 삭제하시겠습니까?')) { indexedDB.deleteDatabase('TobisGrowthOS'); localStorage.clear(); setTimeout(()=>window.location.reload(), 500); }}} style={{padding:'8px 16px', background:'#DC2626', border:'none', color:'white', borderRadius:'4px', cursor:'pointer'}}>🗑 초기화</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// ═══ IME 안전 Input/Textarea ═══
function IMEInput({ value, onChange, onBlur, ...props }) {
  const [local, setLocal] = useState(value || '');
  const isComposing = useRef(false);
  useEffect(() => { if (!isComposing.current) setLocal(value || ''); }, [value]);
  return (
    <input {...props} value={local}
      onChange={e => { setLocal(e.target.value); if (!isComposing.current) onChange && onChange(e.target.value); }}
      onCompositionStart={() => { isComposing.current = true; }}
      onCompositionEnd={e => { isComposing.current = false; onChange && onChange(e.target.value); }}
      onBlur={e => { isComposing.current = false; if (local !== (value || '')) onChange && onChange(local); onBlur && onBlur(e); }}
    />
  );
}
function IMETextarea({ value, onChange, onBlur, ...props }) {
  const [local, setLocal] = useState(value || '');
  const isComposing = useRef(false);
  useEffect(() => { if (!isComposing.current) setLocal(value || ''); }, [value]);
  return (
    <textarea {...props} value={local}
      onChange={e => { setLocal(e.target.value); if (!isComposing.current) onChange && onChange(e.target.value); }}
      onCompositionStart={() => { isComposing.current = true; }}
      onCompositionEnd={e => { isComposing.current = false; onChange && onChange(e.target.value); }}
      onBlur={e => { isComposing.current = false; if (local !== (value || '')) onChange && onChange(local); onBlur && onBlur(e); }}
    />
  );
}

// ═══ IndexedDB ═══
const DB_NAME = 'TobisGrowthOS', DB_VERSION = 1, STORE = 'items';
function openDB() { return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, DB_VERSION); r.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function dbGetAll() { const db = await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}); }
async function dbPut(i) { const db = await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(i);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}); }
async function dbDelete(id) { const db = await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}); }

function getFeedback(stepNum, score) {
  if (!score || score === 0) return null;
  const data = SCORE_FEEDBACK[stepNum];
  if (!data) return null;
  if (score <= 3) return { level: 'critical', ...data.critical };
  if (score <= 6) return { level: 'warning', ...data.warning };
  return null; // 7+ 는 피드백 없음 (잘 하고 있음)
}

// Claude 답변에서 AI 자기 채점 추출
function parseAIScore(answer) {
  if (!answer) return null;
  const scoreMatch = answer.match(/AI_SCORE:\s*(\d+)\s*\/\s*10/i);
  if (!scoreMatch) return null;
  const score = parseInt(scoreMatch[1]);
  if (score < 0 || score > 10) return null;
  
  // AI_근거 섹션 추출
  const reasonSection = answer.match(/AI_근거:\s*([\s\S]*?)(?:\n\n|\n━|\[점수 기준\]|$)/i);
  let reasons = [];
  if (reasonSection) {
    const lines = reasonSection[1].split('\n').filter(l => /^\s*\d+\./.test(l));
    reasons = lines.map(l => l.replace(/^\s*\d+\.\s*/, '').trim()).filter(r => r.length > 0).slice(0, 3);
  }
  
  return { score, reasons };
}

// ═══ Multiplicative-Floor Scoring (MaxKmet 참조) ═══
function calcScoreMatrix(item) {
  const scores = item.scores || {};
  const stepScores = STEP_ORDER.map(s => scores[s]).filter(v => typeof v === 'number' && v > 0);
  if (stepScores.length === 0) return { total: 0, verdict: null, mean: 0, min: 0, filled: 0 };
  const mean = stepScores.reduce((a,b)=>a+b,0) / stepScores.length;
  const min = Math.min(...stepScores);
  const total = Math.round((mean * 0.6 + min * 0.4) * 10);
  let autoVerdict = null;
  if (stepScores.length === 7) {
    if (min <= 3) autoVerdict = 'Kill';
    else if (total >= 75) autoVerdict = 'Go';
    else if (total >= 55) autoVerdict = 'Pivot';
    else autoVerdict = 'Kill';
  }
  return { total, verdict: autoVerdict, mean: mean.toFixed(1), min, filled: stepScores.length };
}

      { id: 's4', type: 'stepNode', position: layout.s4, data: { stepNum: 4, item } },
      { id: 's7', type: 'stepNode', position: layout.s7, data: { stepNum: 7, item } },
      { id: 'gate3', type: 'gateNode', position: layout.gate3, data: { gateNum: 3, phaseStatus } },
      { id: 'synth', type: 'synthNode', position: layout.synth, data: { item, canSynth } },
    ];
  }, [item.id]);

  const [nodes, setNodes, onNodesChange] = RF.useNodesState(initialNodes);

  // 아이템 변경 시 노드 데이터 업데이트
  useEffect(() => {
    setNodes(nds => nds.map(n => {
      if (n.id === 'start') return { ...n, data: { ...n.data, allInputsFilled } };
      if (n.type === 'stepNode') return { ...n, data: { ...n.data, item } };
      if (n.type === 'gateNode') return { ...n, data: { ...n.data, phaseStatus } };
      if (n.type === 'synthNode') return { ...n, data: { ...n.data, item, canSynth } };
      return n;
    }));
  }, [item, allInputsFilled, canSynth]);

  // 엣지 정의
  const edges = useMemo(() => {
    const isStepDone = s => !!item.results?.[s];
    const isGatePassed = g => { const p = g===1?'A':g===2?'B':'C'; return phaseStatus[p].complete; };
    const stepColor = { A: '#3B82F6', B: '#8B5CF6', C: '#F59E0B', FINAL: '#F97316' };
    
    const edgeList = [
      { id:'e-start-s1', source:'start', target:'s1', active: allInputsFilled, phase: 'A' },
      { id:'e-s1-s2', source:'s1', target:'s2', active: isStepDone(1), phase: 'A' },
      { id:'e-s2-s6', source:'s2', target:'s6', active: isStepDone(2), phase: 'A' },
      { id:'e-s6-gate1', source:'s6', target:'gate1', active: isStepDone(6), phase: 'A' },
      { id:'e-gate1-s3', source:'gate1', target:'s3', active: isGatePassed(1), phase: 'B' },
      { id:'e-s3-s5', source:'s3', target:'s5', active: isStepDone(3), phase: 'B' },
      { id:'e-s5-gate2', source:'s5', target:'gate2', active: isStepDone(5), phase: 'B' },
      { id:'e-gate2-s4', source:'gate2', target:'s4', active: isGatePassed(2), phase: 'C' },
      { id:'e-s4-s7', source:'s4', target:'s7', active: isStepDone(4), phase: 'C' },
      { id:'e-s7-gate3', source:'s7', target:'gate3', active: isStepDone(7), phase: 'C' },
      { id:'e-gate3-synth', source:'gate3', target:'synth', active: isGatePassed(3), phase: 'FINAL' },
    ];
    
    return edgeList.map(e => ({
      id: e.id, source: e.source, target: e.target,
      animated: e.active,
      type: 'smoothstep',
      style: { stroke: e.active ? stepColor[e.phase] : '#374151', strokeWidth: e.active ? 2.5 : 1.5 },
      markerEnd: { type: 'arrowclosed', color: e.active ? stepColor[e.phase] : '#374151' }
    }));
  }, [item, phaseStatus, allInputsFilled]);

  const nodeTypes = useMemo(() => ({
    startNode: StartNode, stepNode: StepNode, gateNode: GateNode, synthNode: SynthNode
  }), []);

  // 노드 위치 변경 시 저장
  const onNodeDragStop = useCallback((event, node) => {
    const newLayout = { ...(item.layout || DEFAULT_LAYOUT) };
    newLayout[node.id] = { x: node.position.x, y: node.position.y };
    onUpdate({ ...item, layout: newLayout });
  }, [item, onUpdate]);

  const onNodeClick = useCallback((event, node) => {
    setSelectedNodeId(node.id);
  }, []);

  function resetLayout() {
    if (!confirm('노드 위치를 기본 레이아웃으로 리셋하시겠습니까?')) return;
    onUpdate({ ...item, layout: {...DEFAULT_LAYOUT} });
    setNodes(nds => nds.map(n => ({ ...n, position: DEFAULT_LAYOUT[n.id] })));
    onToast('🔄 레이아웃 리셋');
  }

  return (
    <div className="space-y-4">
      {/* 상단 아이템 헤더 */}
      <div className="bg-gray-900 border border-gray-800 rounded-lg p-4">
        <div className="flex items-center justify-between gap-3 mb-3">
          <IMEInput type="text" value={item.what||''} onChange={v=>onUpdate({...item, what:v})} placeholder="아이템 이름 / 한 줄 설명" className="flex-1 text-lg font-bold bg-transparent border-none outline-none placeholder-gray-600" />
          <button onClick={resetLayout} className="px-3 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded">🔄 레이아웃 리셋</button>
        </div>
        <div className="grid grid-cols-4 gap-2 text-sm">
          <IMEInput type="text" value={item.target||''} onChange={v=>onUpdate({...item, target:v})} placeholder="타겟" className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs" />
          <IMEInput type="text" value={item.price||''} onChange={v=>onUpdate({...item, price:v})} placeholder="가격대" className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs" />
          <IMEInput type="text" value={item.edge||''} onChange={v=>onUpdate({...item, edge:v})} placeholder="우위" className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs" />
          <div className="flex items-center gap-2 text-xs text-gray-400">
            <div className="flex-1 bg-gray-800 rounded-full h-1.5 overflow-hidden"><div className="bg-gradient-to-r from-blue-500 via-purple-500 to-orange-500 h-full" style={{width:`${progress.pct}%`}}></div></div>
            <span>{progress.done}/7</span>
          </div>
        </div>
      </div>

      {/* 캔버스 + 우측 패널 */}
      <div className="grid grid-cols-12 gap-4">
        <div className="col-span-8 bg-gray-900/30 border border-gray-800 rounded-lg overflow-hidden" style={{height:'650px'}}>
          <RF.ReactFlow 
            nodes={nodes} 
            edges={edges} 
            onNodesChange={onNodesChange}
            onNodeDragStop={onNodeDragStop}
            onNodeClick={onNodeClick}
            nodeTypes={nodeTypes}
            fitView
            fitViewOptions={{ padding: 0.2 }}
            minZoom={0.3}
            maxZoom={1.5}
            defaultEdgeOptions={{ type: 'smoothstep' }}
            proOptions={{ hideAttribution: true }}
          >
            <RF.Background color="#1F1F1F" gap={20} size={1} />
            <RF.Controls />
            <RF.MiniMap 
              nodeColor={n => {
                if (n.type === 'startNode') return '#10B981';
                if (n.type === 'gateNode') return '#F59E0B';
                if (n.type === 'synthNode') return '#F97316';
                if (n.type === 'stepNode') {
                  const step = STEPS[n.data.stepNum];
                  return PHASE_INFO[step.phase].color;
                }
                return '#6B7280';
              }}
              maskColor="rgba(10,10,10,0.8)"
            />
          </RF.ReactFlow>
        </div>
        <div className="col-span-4">
          <NodePanel selectedNodeId={selectedNodeId} item={item} onUpdate={onUpdate} onCopy={onCopy} onToast={onToast} allInputsFilled={allInputsFilled} phaseStatus={phaseStatus} />
        </div>
      </div>
    </div>
  );
}

// ═══ 노드 상세 패널 (프롬프트 편집 가능) ═══
function NodePanel({ selectedNodeId, item, onUpdate, onCopy, onToast, allInputsFilled, phaseStatus }) {
  if (!selectedNodeId) {
    return (
      <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 h-[650px] flex items-center justify-center text-center">
        <div>
          <div className="text-4xl mb-3">👆</div>
          <p className="text-sm text-gray-500">캔버스에서 노드 클릭</p>
          <p className="text-xs text-gray-600 mt-2">노드 드래그로 자유 배치<br/>하단 컨트롤로 줌·팬</p>
          <div className="mt-4 text-left text-xs text-gray-600 space-y-1 border-t border-gray-800 pt-3">
            <div>🖱 노드 드래그: 자유 배치</div>
            <div>⚙️ 휠: 줌 인/아웃</div>
            <div>✋ 빈 공간 드래그: 화면 이동</div>
            <div>📍 위치 자동 저장</div>
          </div>
        </div>
      </div>
    );
  }

  if (selectedNodeId === 'start') return <StartPanel item={item} onUpdate={onUpdate} allInputsFilled={allInputsFilled} />;
  if (selectedNodeId.startsWith('s') && selectedNodeId !== 'synth' && selectedNodeId !== 'start') {
    // s1, s2, s6, s3, s5, s4, s7
    const stepNum = parseInt(selectedNodeId.slice(1));
    if (STEPS[stepNum]) return <StepPanel stepNum={stepNum} item={item} onUpdate={onUpdate} onCopy={onCopy} onToast={onToast} allInputsFilled={allInputsFilled} />;
  }
  if (selectedNodeId.startsWith('gate')) {
    const gateNum = parseInt(selectedNodeId.slice(4));
    return <GatePanel gateNum={gateNum} item={item} phaseStatus={phaseStatus} />;
  }
  if (selectedNodeId === 'synth') return <SynthPanel item={item} onUpdate={onUpdate} onCopy={onCopy} onToast={onToast} />;
  return null;
}

function StartPanel({ item, onUpdate, allInputsFilled }) {
  return (
    <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 h-[650px] overflow-y-auto scrollbar">
      <h3 className="font-bold mb-3">▶ START · 5필드 입력</h3>
      <div className="space-y-3 text-sm">
        {['what','target','price','edge'].map((f, idx) => (
          <div key={f}>
            <label className="text-xs text-gray-500 block mb-1">{['아이템 (무엇)','타겟 (누구)','가격대','나의 부당한 우위'][idx]}</label>
            <IMEInput type="text" value={item[f]||''} onChange={v=>onUpdate({...item, [f]:v})} className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-sm" />
          </div>
        ))}
        <div className={`mt-4 p-3 rounded ${allInputsFilled?'bg-green-900/30 border border-green-700':'bg-yellow-900/30 border border-yellow-700'}`}>
          <div className="text-xs font-semibold mb-1">{allInputsFilled?'✅ 입력 완료':'⚠️ 모든 필드 입력 필수'}</div>
          <p className="text-xs text-gray-300">{allInputsFilled?'Day 1부터 실행 가능':'빈 필드 채워야 프롬프트 생성 가능'}</p>
        </div>
      </div>
    </div>
  );
}

function StepPanel({ stepNum, item, onUpdate, onCopy, onToast, allInputsFilled }) {
  const step = STEPS[stepNum];
  const hasResult = !!item.results?.[stepNum];
  const dayIdx = STEP_ORDER.indexOf(stepNum) + 1;
  const [showPromptEditor, setShowPromptEditor] = useState(false);
  const [tab, setTab] = useState('answer'); // answer | prompt
  
  const currentPrompt = getPromptForStep(item, stepNum);
  const isCustom = !!item.customPrompts?.[stepNum];

  function saveResult(val) {
    onUpdate({ ...item, results: { ...item.results, [stepNum]: val } });
  }
  function deleteResult() {
    if (!confirm(`Day ${dayIdx} 결과 삭제?`)) return;
    const r = { ...item.results }; delete r[stepNum];
    onUpdate({ ...item, results: r });
  }
  function savePrompt(val) {
    onUpdate({ ...item, customPrompts: { ...item.customPrompts, [stepNum]: val } });
    onToast('💾 프롬프트 저장');
  }
  function resetPrompt() {
    if (!confirm('프롬프트를 기본값으로 되돌릴까요?')) return;
    const cp = { ...item.customPrompts };
    delete cp[stepNum];
    onUpdate({ ...item, customPrompts: cp });
    onToast('🔄 기본 프롬프트로 복원');
  }

  return (
    <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 h-[650px] overflow-y-auto scrollbar">
      <div className="mb-3">
        <div className="text-xs text-gray-500">Day {dayIdx} · Phase {step.phase}</div>
        <h3 className="font-bold text-lg">{step.code} {step.title}</h3>
        <p className="text-xs text-gray-400 mt-1 italic">"{step.tagline}"</p>
      </div>
      <div className="bg-black/50 border border-gray-800 rounded p-2 mb-3">
        <div className="text-xs text-gray-500 mb-1">⚙️ 분석 엔진</div>
        <div className="text-xs text-gray-300">{step.engine}</div>
      </div>

      <div className="flex border-b border-gray-800 mb-3">
        <button onClick={()=>setTab('answer')} className={`px-3 py-1.5 text-xs font-semibold ${tab==='answer'?'border-b-2 border-orange-500 text-orange-400':'text-gray-500'}`}>📝 답변</button>
        <button onClick={()=>setTab('prompt')} className={`px-3 py-1.5 text-xs font-semibold ${tab==='prompt'?'border-b-2 border-orange-500 text-orange-400':'text-gray-500'}`}>
          🛠 프롬프트 {isCustom && <span className="text-[9px] bg-purple-700 text-white px-1 rounded ml-1">수정됨</span>}
        </button>
      </div>

      {tab === 'answer' && (
        <>
          <button onClick={() => { if(!allInputsFilled){alert('먼저 START 5필드 입력');return;} onCopy(currentPrompt); onToast('📋 복사 완료'); }} disabled={!allInputsFilled}
            className={`w-full py-2 rounded text-sm font-semibold mb-3 ${allInputsFilled?'bg-orange-600 hover:bg-orange-500':'bg-gray-800 text-gray-600 cursor-not-allowed'}`}>
            📋 프롬프트 복사 → Claude
          </button>
          <div>
            <label className="text-xs text-gray-500 block mb-1">📝 Claude 답변 붙여넣기</label>
            <IMETextarea value={item.results?.[stepNum] || ''} onChange={saveResult}
              placeholder="여기에 Claude 답변 붙여넣기 → 다른 곳 클릭 시 자동 저장"
              className="w-full h-52 bg-gray-800 border border-gray-700 rounded p-2 text-xs resize-y scrollbar" />
            <div className="flex items-center justify-between mt-1 text-xs text-gray-600">
              <span>{(item.results?.[stepNum] || '').length}자</span>
              {hasResult && <button onClick={deleteResult} className="text-red-400 hover:text-red-300">결과 삭제</button>}
            </div>
          </div>

          {/* 🆕 Day 점수 슬라이더 (Multiplicative-Floor Scoring) */}
          {hasResult && (
            <div className="mt-3 p-3 bg-black/40 border border-gray-800 rounded">
              {/* AI 자기 채점 표시 */}
              {(() => {
                const aiScore = parseAIScore(item.results?.[stepNum]);
                if (!aiScore) {
                  return (
                    <div className="mb-3 p-2 bg-gray-900/60 border border-dashed border-gray-700 rounded text-[10px] text-gray-400">
                      💡 <b>AI 자기 채점 없음</b> — 이 답변은 구버전 프롬프트로 실행됨.
                      <div className="mt-1">
                        <button 
                          onClick={() => { onCopy(currentPrompt); onToast('📋 프롬프트 복사 → Claude 재실행 → 답변 덮어쓰기'); }}
                          className="text-purple-400 hover:text-purple-300 underline">
                          최신 프롬프트로 재실행하면 AI 의견 함께 받을 수 있음 →
                        </button>
                      </div>
                    </div>
                  );
                }
                const myScore = item.scores?.[stepNum] || 0;
                const diff = Math.abs(aiScore.score - myScore);
                const hasBias = myScore > 0 && diff >= 3;
                return (
                  <div className="mb-3 p-2.5 bg-purple-900/30 border border-purple-700 rounded">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="text-[11px] font-semibold text-purple-200">🤖 Tobis Strategist 자기 채점</span>
                      <span className={`text-base font-bold ${
                        aiScore.score <= 3 ? 'text-red-300' :
                        aiScore.score <= 6 ? 'text-yellow-300' : 'text-green-300'
                      }`}>
                        {aiScore.score}<span className="text-[10px] text-gray-400">/10</span>
                      </span>
                    </div>
                    {aiScore.reasons.length > 0 && (
                      <ul className="text-[10px] text-gray-300 space-y-0.5 mt-1.5 pl-3 border-l border-purple-800">
                        {aiScore.reasons.map((r, i) => <li key={i}>• {r}</li>)}
                      </ul>
                    )}
                    {hasBias && (
                      <div className="mt-2 pt-2 border-t border-purple-800/50 p-1.5 bg-yellow-900/20 rounded text-[10px] text-yellow-200">
                        ⚠️ <b>편향 경고</b>: 당신 {myScore}점 vs AI {aiScore.score}점 · 차이 {diff}점
                        <div className="mt-0.5 text-[9px] text-yellow-300/80">
                          {myScore > aiScore.score 
                            ? '낙관 편향 가능성 — AI가 더 낮게 평가. 답변 재검토 권장.' 
                            : '비관 편향 가능성 — AI가 더 높게 평가. 긍정 요소 재검토.'}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              <div className="flex items-center justify-between mb-2">
                <label className="text-xs text-gray-400 font-semibold">🎯 내 점수 (0~10)</label>
                <span className={`text-lg font-bold ${
                  (item.scores?.[stepNum]||0) <= 3 ? 'text-red-400' :
                  (item.scores?.[stepNum]||0) <= 6 ? 'text-yellow-400' : 'text-green-400'
                }`}>
                  {item.scores?.[stepNum] || 0}
                  <span className="text-xs text-gray-500 ml-1">/10</span>
                </span>
              </div>
              <input type="range" min="0" max="10" step="1"
                value={item.scores?.[stepNum] || 0}
                onChange={e => onUpdate({...item, scores: {...item.scores, [stepNum]: parseInt(e.target.value)}})}
                className="w-full accent-orange-500" />
              <div className="flex justify-between text-[10px] text-gray-600 mt-1">
                <span>0 (치명적)</span>
                <span>5 (중립)</span>
                <span>10 (탁월)</span>
              </div>

              {/* AI 점수 자동 반영 버튼 */}
              {(() => {
                const aiScore = parseAIScore(item.results?.[stepNum]);
                if (!aiScore) return null;
                const myScore = item.scores?.[stepNum] || 0;
                if (myScore === aiScore.score) return null;
                return (
                  <button 
                    onClick={() => onUpdate({...item, scores: {...item.scores, [stepNum]: aiScore.score}})}
                    className="mt-2 w-full py-1 bg-purple-900/40 hover:bg-purple-900/60 border border-purple-700 rounded text-[10px] text-purple-200">
                    🤖 AI 점수 ({aiScore.score}점)로 세팅
                  </button>
                );
              })()}

              {/* 점수별 차별화된 피드백 카드 */}
              {(() => {
                const score = item.scores?.[stepNum] || 0;
                const fb = getFeedback(stepNum, score);
                if (!fb) {
                  if (score >= 7) {
                    return (
                      <div className="mt-3 p-2.5 bg-green-900/30 border border-green-700 rounded text-[11px]">
                        <div className="text-green-300 font-semibold mb-1">⭐ 탁월 — 이 요소는 경쟁 우위로 활용</div>
                        <div className="text-green-200 text-[10px]">다음 Day로 진행. 이 Day 결과를 마케팅/피칭에서 핵심 메시지로 뽑아라.</div>
                      </div>
                    );
                  }
                  return null;
                }
                return (
                  <div className={`mt-3 p-3 rounded border ${
                    fb.level === 'critical' ? 'bg-red-900/30 border-red-700' : 'bg-yellow-900/20 border-yellow-700'
                  }`}>
                    <div className={`font-bold text-xs mb-1 ${fb.level === 'critical' ? 'text-red-300' : 'text-yellow-300'}`}>
                      {fb.title}
                    </div>
                    <div className="text-[10px] text-gray-300 mb-2 italic">진단: {fb.diagnosis}</div>
                    <div className="text-[10px] text-gray-400 font-semibold mb-1">💡 권장 액션:</div>
                    <ul className="space-y-0.5 text-[10px] text-gray-300">
                      {fb.actions.map((a, i) => <li key={i} className="leading-relaxed">• {a}</li>)}
                    </ul>
                    {fb.killRisk && (
                      <div className="mt-2 pt-2 border-t border-red-900/50 text-[10px] text-red-300">
                        <b>⚠️ Kill 리스크:</b> {fb.killRisk}
                      </div>
                    )}
                    {fb.level === 'critical' && (
                      <button 
                        onClick={() => { onCopy(currentPrompt); onToast('📋 재실행 프롬프트 복사 → Claude'); }}
                        className="mt-2 w-full py-1.5 bg-red-800 hover:bg-red-700 rounded text-[10px] text-white font-semibold">
                        🔄 이 Day 프롬프트 재실행 (결과 개선 시도)
                      </button>
                    )}
                  </div>
                );
              })()}
            </div>
          )}
        </>
      )}

      {tab === 'prompt' && (
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-xs text-gray-500">🛠 프롬프트 원문 (편집 가능)</label>
            {isCustom && <button onClick={resetPrompt} className="text-xs text-yellow-400 hover:text-yellow-300">↺ 기본값 복원</button>}
          </div>
          <IMETextarea value={currentPrompt} onChange={savePrompt}
            placeholder="프롬프트 원문..."
            className="w-full h-80 bg-gray-800 border border-gray-700 rounded p-2 text-[11px] font-mono resize-y scrollbar" />
          <div className="flex items-center justify-between mt-1 text-xs text-gray-600">
            <span>{currentPrompt.length}자</span>
            <button onClick={()=>{ onCopy(currentPrompt); onToast('📋 복사'); }} className="text-orange-400 hover:text-orange-300">📋 복사</button>
          </div>
          <div className="mt-2 p-2 bg-purple-900/20 border border-purple-800 rounded text-xs text-gray-300">
            💡 프롬프트를 수정하면 이 아이템에만 적용됩니다. 다른 아이템은 기본 프롬프트 유지.
          </div>
        </div>
      )}
    </div>
  );
}

function GatePanel({ gateNum, item, phaseStatus }) {
  const phase = gateNum===1?'A':gateNum===2?'B':'C';
  const status = phaseStatus[phase];
  const gateCriteria = {
    1: ['시장 성장률 ≥ 10%', 'WTP(돈 낼 의향) 검증된 문제 1개 이상', '명확한 포지셔닝 공백 1개 이상', '→ 3개 중 2개 Pass 시 계속, 2개 미달 시 Pivot/Kill'],
    2: ['실제 타겟 5명에게 오퍼 테스트 완료', '5명 중 3명 이상 "돈 낸다" 응답', '가격 저항 2명 이하', '→ 미달 시 오퍼 재설계 or Kill'],
    3: ['론칭 후 30일 내 유료 고객 ≥ 3명', 'CAC < LTV / 3', '주 1회 이상 반복 매출', '→ 미달 시 Kill (매몰비용 차단)']
  };
  return (
    <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 h-[650px] overflow-y-auto scrollbar">
      <h3 className="font-bold mb-2">◇ Kill Gate {gateNum}</h3>
      <div className="text-xs text-gray-400 mb-3">{PHASE_INFO[phase].name}</div>
      <div className={`p-3 rounded mb-3 ${status.complete?'bg-orange-900/30 border border-orange-700':'bg-gray-800 border border-gray-700'}`}>
        <div className="text-xs font-semibold mb-1">{status.complete?`✅ Phase ${phase} 완료 — Gate 체크 필요`:`⏳ ${status.done}/${status.total} 단계 완료`}</div>
      </div>
      <h4 className="text-sm font-semibold mb-2">Pass 조건</h4>
      <ul className="space-y-2 text-sm text-gray-300">
        {gateCriteria[gateNum].map((c, i) => (
          <li key={i} className={i === gateCriteria[gateNum].length-1 ? 'pt-2 border-t border-gray-800 text-xs text-gray-400' : 'flex gap-2'}>
            {i < gateCriteria[gateNum].length-1 && <span>□</span>}
            <span>{c}</span>
          </li>
        ))}
      </ul>
      <div className="mt-4 p-3 bg-gray-800 rounded text-xs text-gray-400">💡 Gate 판정은 감정 배제. 미달이면 Kill/Pivot 결정을 지금.</div>
    </div>
  );
}

function SynthPanel({ item, onUpdate, onCopy, onToast }) {
  const progress = calcProgress(item);
  const canSynth = progress.done === 7;
  const [tab, setTab] = useState('answer');
  const isCustom = !!item.customPrompts?.[8];
  const currentPrompt = isCustom ? item.customPrompts[8] : STEPS[8].buildPrompt(item);
  const scoreMatrix = calcScoreMatrix(item);

  function saveSynth(val) { onUpdate({ ...item, synthResult: val }); }
  function setVerdict(v) {
    let ns = item.status;
    if (v==='Go') ns='go'; else if (v==='Pivot') ns='pivoted'; else if (v==='Kill') ns='killed';
    onUpdate({ ...item, verdict: v, status: ns });
    onToast(`판결: ${v}`);
  }
  function savePrompt(val) { onUpdate({ ...item, customPrompts: { ...item.customPrompts, 8: val } }); }
  function resetPrompt() {
    if (!confirm('프롬프트 기본값 복원?')) return;
    const cp = { ...item.customPrompts }; delete cp[8];
    onUpdate({ ...item, customPrompts: cp });
    onToast('🔄 복원');
  }

  return (
    <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 h-[650px] overflow-y-auto scrollbar">
      <h3 className="font-bold text-lg mb-1">⑧ Synthesizer</h3>
      <p className="text-xs text-gray-400 mb-3 italic">"7개 렌즈를 1개 결정으로 수렴한다"</p>
      <div className={`p-3 rounded mb-3 ${canSynth?'bg-orange-900/30 border border-orange-700':'bg-gray-800 border border-gray-700'}`}>
        <div className="text-xs font-semibold">{canSynth?'✅ 7/7 완료':`⏳ ${progress.done}/7 완료`}</div>
      </div>

      {/* 🆕 Multiplicative-Floor Score 대시보드 */}
      {scoreMatrix.filled > 0 && (
        <div className="mb-3 p-3 bg-gradient-to-br from-purple-900/20 to-black border border-purple-800 rounded">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs text-purple-300 font-semibold">🎯 Multiplicative-Floor Score</div>
            <div className="text-[10px] text-gray-500">{scoreMatrix.filled}/7 평가</div>
          </div>
          <div className="flex items-center gap-3 mb-2">
            <div className={`text-3xl font-bold ${
              scoreMatrix.total >= 75 ? 'text-green-400' :
              scoreMatrix.total >= 55 ? 'text-yellow-400' : 'text-red-400'
            }`}>
              {scoreMatrix.total}
              <span className="text-xs text-gray-500 ml-1">/100</span>
            </div>
            <div className="flex-1 text-[10px] text-gray-400 leading-relaxed">
              평균: <b>{scoreMatrix.mean}</b> · 최저: <b className={scoreMatrix.min <= 3 ? 'text-red-400' : ''}>{scoreMatrix.min}</b>
              {scoreMatrix.min <= 3 && <div className="text-red-400 mt-0.5">⚠️ 치명적 약점 존재</div>}
            </div>
          </div>
          {scoreMatrix.verdict && scoreMatrix.filled === 7 && (
            <div className={`p-2 rounded text-xs mt-2 ${
              scoreMatrix.verdict === 'Go' ? 'bg-green-900/40 border border-green-700 text-green-300' :
              scoreMatrix.verdict === 'Pivot' ? 'bg-yellow-900/40 border border-yellow-700 text-yellow-300' :
              'bg-red-900/40 border border-red-700 text-red-300'
            }`}>
              <div className="font-semibold">🤖 자동 추천 판결: {scoreMatrix.verdict}</div>
              <div className="text-[10px] mt-1 opacity-80">
                {scoreMatrix.verdict === 'Go' ? '모든 단계 양호. 진행 권장.' :
                 scoreMatrix.verdict === 'Pivot' ? '개선 여지 있음. 특정 단계 재설계.' :
                 '치명적 약점 또는 전반적 저조. 중단 권장.'}
              </div>
              <button onClick={() => setVerdict(scoreMatrix.verdict)} className="mt-2 text-[10px] underline">
                → 이 판결로 확정
              </button>
            </div>
          )}
          <div className="grid grid-cols-7 gap-1 mt-2">
            {STEP_ORDER.map((s, idx) => {
              const sc = item.scores?.[s] || 0;
              return (
                <div key={s} className="text-center">
                  <div className={`text-[10px] font-bold py-1 rounded ${
                    sc === 0 ? 'bg-gray-800 text-gray-600' :
                    sc <= 3 ? 'bg-red-900 text-red-300' :
                    sc <= 6 ? 'bg-yellow-900 text-yellow-300' :
                    'bg-green-900 text-green-300'
                  }`}>{sc || '-'}</div>
                  <div className="text-[9px] text-gray-600">D{idx+1}</div>
                </div>
              );
            })}
          </div>

          {/* 치명적 약점 요약 */}
          {(() => {
            const criticalDays = STEP_ORDER
              .map((s, idx) => ({ stepNum: s, dayIdx: idx+1, score: item.scores?.[s] || 0 }))
              .filter(d => d.score > 0 && d.score <= 3);
            const warningDays = STEP_ORDER
              .map((s, idx) => ({ stepNum: s, dayIdx: idx+1, score: item.scores?.[s] || 0 }))
              .filter(d => d.score >= 4 && d.score <= 6);
            if (criticalDays.length === 0 && warningDays.length === 0 && scoreMatrix.filled > 0) {
              return (
                <div className="mt-3 p-2 bg-green-900/20 border border-green-800 rounded text-[10px] text-green-300 text-center">
                  ⭐ 치명적 약점 없음 — 진행 적합
                </div>
              );
            }
            return (
              <div className="mt-3 space-y-2">
                {criticalDays.length > 0 && (
                  <div className="p-2 bg-red-900/30 border border-red-700 rounded">
                    <div className="text-[10px] font-bold text-red-300 mb-1">🔴 치명적 약점 {criticalDays.length}개</div>
                    <ul className="text-[10px] text-red-200 space-y-0.5">
                      {criticalDays.map(d => {
                        const fb = getFeedback(d.stepNum, d.score);
                        return <li key={d.stepNum}>• Day {d.dayIdx}: {fb?.title || '약점'} ({d.score}점)</li>;
                      })}
                    </ul>
                    <div className="text-[9px] text-red-300 mt-1 pt-1 border-t border-red-900/50">
                      → 해당 Day 노드 클릭해서 재실행 또는 Pivot 검토
                    </div>
                  </div>
                )}
                {warningDays.length > 0 && (
                  <div className="p-2 bg-yellow-900/20 border border-yellow-700 rounded">
                    <div className="text-[10px] font-bold text-yellow-300 mb-1">🟡 개선 필요 {warningDays.length}개</div>
                    <ul className="text-[10px] text-yellow-200 space-y-0.5">
                      {warningDays.map(d => {
                        const fb = getFeedback(d.stepNum, d.score);
                        return <li key={d.stepNum}>• Day {d.dayIdx}: {fb?.title || '개선'} ({d.score}점)</li>;
                      })}
                    </ul>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      <div className="flex border-b border-gray-800 mb-3">
        <button onClick={()=>setTab('answer')} className={`px-3 py-1.5 text-xs font-semibold ${tab==='answer'?'border-b-2 border-orange-500 text-orange-400':'text-gray-500'}`}>📝 판결</button>
        <button onClick={()=>setTab('prompt')} className={`px-3 py-1.5 text-xs font-semibold ${tab==='prompt'?'border-b-2 border-orange-500 text-orange-400':'text-gray-500'}`}>🛠 프롬프트 {isCustom && <span className="text-[9px] bg-purple-700 text-white px-1 rounded ml-1">수정됨</span>}</button>
      </div>

      {tab === 'answer' && (
        <>
          <button disabled={!canSynth} onClick={()=>{onCopy(currentPrompt); onToast('📋 복사');}}
            className={`w-full py-2 rounded text-sm font-semibold mb-3 ${canSynth?'bg-orange-600 hover:bg-orange-500':'bg-gray-800 text-gray-600 cursor-not-allowed'}`}>
            📋 Synthesizer 프롬프트 복사
          </button>
          <label className="text-xs text-gray-500 block mb-1">📝 최종 판결 결과</label>
          <IMETextarea value={item.synthResult || ''} onChange={saveSynth}
            placeholder="Claude 최종 판결 붙여넣기..."
            className="w-full h-40 bg-gray-800 border border-gray-700 rounded p-2 text-xs resize-y scrollbar mb-3" />
          <div className="grid grid-cols-3 gap-2">
            <button onClick={()=>setVerdict('Go')} className={`py-2 rounded text-xs font-bold ${item.verdict==='Go'?'bg-green-600':'bg-green-800 hover:bg-green-700'}`}>✅ Go</button>
            <button onClick={()=>setVerdict('Pivot')} className={`py-2 rounded text-xs font-bold ${item.verdict==='Pivot'?'bg-yellow-600':'bg-yellow-800 hover:bg-yellow-700'}`}>🔄 Pivot</button>
            <button onClick={()=>setVerdict('Kill')} className={`py-2 rounded text-xs font-bold ${item.verdict==='Kill'?'bg-red-600':'bg-red-800 hover:bg-red-700'}`}>❌ Kill</button>
          </div>
        </>
      )}

      {tab === 'prompt' && (
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-xs text-gray-500">🛠 프롬프트 원문</label>
            {isCustom && <button onClick={resetPrompt} className="text-xs text-yellow-400">↺ 복원</button>}
          </div>
          <IMETextarea value={currentPrompt} onChange={savePrompt}
            className="w-full h-80 bg-gray-800 border border-gray-700 rounded p-2 text-[11px] font-mono resize-y scrollbar" />
          <button onClick={()=>{ onCopy(currentPrompt); onToast('📋 복사'); }} className="mt-2 text-xs text-orange-400">📋 복사</button>
        </div>
      )}
    </div>
  );
}

// ═══ App ═══
function App() {
  const [items, setItems] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [sortBy, setSortBy] = useState('updated');
  const [toast, setToast] = useState('');
  const [view, setView] = useState('canvas');

  useEffect(() => { (async () => {
    try {
      const d = await dbGetAll();
      const normalized = d.map(it => ({
        ...newItem(),
        ...it,
        results: it.results || {},
        tags: Array.isArray(it.tags) ? it.tags : [],
        status: it.status || 'active',
        customPrompts: it.customPrompts || {},
        layout: it.layout || {...DEFAULT_LAYOUT},
        scores: it.scores || {},
        bmc: it.bmc || { customerSegments:'', valuePropositions:'', channels:'', customerRelationships:'', revenueStreams:'', keyResources:'', keyActivities:'', keyPartners:'', costStructure:'' }
      }));
      setItems(normalized);
      if (normalized.length>0) setSelectedId(normalized[0].id);
    } catch(e){ console.error(e); showToast('DB 오류: '+e.message); }
    finally { setLoading(false); }
  })(); }, []);

  useEffect(() => {
    if (items.length === 0) return;
    const last = localStorage.getItem('lastBackup');
    const today = new Date().toDateString();
    if (last !== today) {
      setTimeout(() => {
        downloadJSON(items, `tobis-backup-${today.replace(/\s/g,'-')}.json`);
        localStorage.setItem('lastBackup', today);
        showToast('🔄 일일 백업');
      }, 2000);
    }
  }, [items.length]);

  function showToast(m) { setToast(m); setTimeout(()=>setToast(''), 2500); }
  const selected = items.find(i => i.id === selectedId);

  async function saveItem(u) { u.updatedAt=Date.now(); await dbPut(u); setItems(p=>p.map(i=>i.id===u.id?u:i)); }
  async function addItem() { const it=newItem(); await dbPut(it); setItems(p=>[it,...p]); setSelectedId(it.id); }
  async function removeItem(id) { if(!confirm('삭제?'))return; await dbDelete(id); setItems(p=>p.filter(i=>i.id!==id)); if(selectedId===id)setSelectedId(null); showToast('삭제됨'); }
  function copyText(t) { navigator.clipboard.writeText(t).then(()=>showToast('📋 복사 완료')); }

  const visibleItems = useMemo(() => {
    let arr = items.filter(i => i.status !== 'archived');
    if (search.trim()) { const q=search.toLowerCase(); arr = arr.filter(i=>(i.what||'').toLowerCase().includes(q)||(i.target||'').toLowerCase().includes(q)); }
    if (sortBy==='updated') arr=[...arr].sort((a,b)=>b.updatedAt-a.updatedAt);
    return arr;
  }, [items, search, sortBy]);

  const goCount = items.filter(i=>i.verdict==='Go').length;
  const completedCount = items.filter(i=>calcProgress(i).done===7).length;
  const deployReady = completedCount>=3 && goCount>=1;

  function exportAll() { downloadJSON(items, `tobis-export-${Date.now()}.json`); showToast('📥 내보냄'); }
  async function importAll(e) {
    const f=e.target.files[0]; if(!f) return;
    try { const d=JSON.parse(await f.text()); if(!Array.isArray(d)) throw new Error('형식 오류');
      for (const it of d) await dbPut(it); setItems(await dbGetAll()); showToast(`📤 ${d.length}개`);
    } catch(err) { showToast('❌ '+err.message); }
    e.target.value='';
  }

  if (loading) return <div className="h-screen flex items-center justify-center text-gray-500">로딩...</div>;

  return (
    <div className="min-h-screen">
      <header className="border-b border-gray-800 bg-black/50 backdrop-blur sticky top-0 z-40 no-print">
        <div className="max-w-[1400px] mx-auto px-6 py-3 flex items-center justify-between">
          <div className="flex items-center gap-4">
            <a href="/" className="text-xl font-bold hover:opacity-80 transition no-underline" style={{color:'#E5E5E5'}}>🦊 Tobis Growth OS</a>
            <span className="text-xs text-gray-500">v2.4 · BMC 학습가이드</span>
          </div>
          <div className="flex items-center gap-2 text-sm">
            <a href="/" className="px-3 py-1.5 rounded text-gray-400 hover:text-white hover:bg-gray-800 hidden md:inline-block no-underline">← 소개</a>
            <div className="w-px h-5 bg-gray-700 mx-1 hidden md:block"></div>
            <button onClick={()=>setView('canvas')} className={`px-3 py-1.5 rounded ${view==='canvas'?'bg-orange-600':'hover:bg-gray-800'}`}>🔀 캔버스</button>
            <button onClick={()=>setView('bmc')} className={`px-3 py-1.5 rounded ${view==='bmc'?'bg-orange-600':'hover:bg-gray-800'}`}>📋 BMC</button>
            <button onClick={()=>setView('report')} className={`px-3 py-1.5 rounded ${view==='report'?'bg-orange-600':'hover:bg-gray-800'}`}>📄 리포트</button>
            <button onClick={()=>setView('help')} className={`px-3 py-1.5 rounded ${view==='help'?'bg-orange-600':'hover:bg-gray-800'}`}>📖 가이드</button>
            <div className="w-px h-5 bg-gray-700 mx-2"></div>
            <button onClick={exportAll} className="px-3 py-1.5 rounded hover:bg-gray-800 text-gray-400">📥</button>
            <label className="px-3 py-1.5 rounded hover:bg-gray-800 text-gray-400 cursor-pointer">📤<input type="file" accept=".json" onChange={importAll} className="hidden" /></label>
          </div>
        </div>
      </header>

      <div className={`border-b border-gray-800 ${deployReady?'bg-green-900/20':'bg-gray-900/30'} no-print`}>
        <div className="max-w-[1400px] mx-auto px-6 py-1.5 text-xs flex items-center gap-4">
          <span className="text-gray-400">🎯 배포 준비:</span>
          <span>완주 <b>{completedCount}/3</b></span>
          <span>Go <b>{goCount}/1</b></span>
          {deployReady ? <span className="text-green-400 ml-auto">✅ 배포 가능</span> : <span className="text-gray-500 ml-auto">3완주+1Go 시</span>}
        </div>
      </div>

      <main className="max-w-[1400px] mx-auto px-6 py-4">
        {view==='help' && <HelpView onClose={()=>setView('canvas')} />}
        {view==='report' && <ReportView item={selected} items={items} selectedId={selectedId} setSelectedId={setSelectedId} onBack={()=>setView('canvas')} onToast={showToast} />}
        {view==='bmc' && <BMCView item={selected} items={items} selectedId={selectedId} setSelectedId={setSelectedId} onUpdate={saveItem} onCopy={copyText} onBack={()=>setView('canvas')} onToast={showToast} />}
        
        {view==='canvas' && (
          <div className="grid grid-cols-12 gap-4">
            <aside className="col-span-2">
              <button onClick={addItem} className="w-full py-2 bg-orange-600 hover:bg-orange-500 rounded-lg font-semibold mb-2 transition text-sm">+ 새 아이템</button>
              <IMEInput type="text" placeholder="🔍 검색" value={search} onChange={v=>setSearch(v)} className="w-full px-2 py-1.5 bg-gray-900 border border-gray-800 rounded text-xs mb-2" />
              <div className="space-y-1.5 max-h-[calc(100vh-240px)] overflow-y-auto scrollbar pr-1">
                {visibleItems.length===0 && <div className="text-center py-6 text-gray-600 text-xs">없음</div>}
                {visibleItems.map(it => (
                  <div key={it.id} onClick={()=>setSelectedId(it.id)}
                    className={`p-2 border rounded cursor-pointer text-xs transition ${selectedId===it.id?'bg-gray-800 border-orange-500':'bg-gray-900 border-gray-800 hover:border-gray-700'}`}>
                    <div className="flex items-start justify-between gap-1 mb-1">
                      <div className="font-semibold truncate flex-1">{it.what||'(이름없음)'}</div>
                      <div className={`w-1.5 h-1.5 rounded-full mt-1 ${it.verdict==='Go'?'bg-green-500':it.verdict==='Pivot'?'bg-yellow-500':it.verdict==='Kill'?'bg-red-500':'bg-gray-500'}`}></div>
                    </div>
                    <div className="flex items-center gap-1">
                      <div className="flex-1 bg-gray-800 rounded-full h-1 overflow-hidden"><div className="bg-orange-500 h-full" style={{width:`${calcProgress(it).pct}%`}}></div></div>
                      <span className="text-gray-500 text-[10px]">{calcProgress(it).done}/7</span>
                    </div>
                    <button onClick={e=>{e.stopPropagation(); removeItem(it.id);}} className="text-[10px] text-red-400 hover:text-red-300 mt-1">🗑 삭제</button>
                  </div>
                ))}
              </div>
            </aside>
            <section className="col-span-10">
              {selected ? (
                <CanvasView item={selected} onUpdate={saveItem} onCopy={copyText} onToast={showToast} />
              ) : (
                <div className="text-center py-20 text-gray-600"><div className="text-5xl mb-4">🔀</div><p>아이템 선택 또는 추가</p></div>
              )}
            </section>
          </div>
        )}
      </main>

      {toast && <div className="fixed bottom-6 right-6 bg-gray-900 border border-gray-700 px-4 py-2 rounded-lg shadow-xl text-sm fade-in z-50">{toast}</div>}
    </div>
  );
}

// ═══ BMC 뷰 (kaailash SIV 참조) ═══
function BMCView({ item, items, selectedId, setSelectedId, onUpdate, onCopy, onBack, onToast }) {
  const activeItems = items.filter(i => i.status !== 'archived');

  if (!item) {
    return (
      <div>
        <button onClick={onBack} className="text-sm text-gray-400 mb-4">← 뒤로</button>
        <h2 className="text-xl font-bold mb-4">📋 Business Model Canvas</h2>
        <div className="text-center py-20 text-gray-600">
          <p>BMC를 작성할 아이템을 선택하세요</p>
          <div className="max-w-md mx-auto mt-6 space-y-2">
            {activeItems.map(it => (
              <button key={it.id} onClick={()=>setSelectedId(it.id)} className="w-full text-left p-3 bg-gray-900 border border-gray-800 rounded hover:border-orange-500">
                <div className="font-semibold text-sm">{it.what||'이름없음'}</div>
                <div className="text-xs text-gray-500">{calcProgress(it).done}/7 · {it.verdict||'미판결'}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const bmc = item.bmc || {};
  const progress = calcProgress(item);

  function saveBlock(key, val) {
    onUpdate({ ...item, bmc: { ...bmc, [key]: val } });
  }

  function copyAutoPrompt() {
    if (progress.done === 0) { onToast('먼저 Day 분석을 1개라도 완료하세요'); return; }
    const prompt = buildBMCDraftPrompt(item);
    onCopy(prompt);
    onToast('📋 BMC 초안 프롬프트 복사 → Claude에서 실행');
  }

  function importFromJSON() {
    const raw = prompt('Claude가 반환한 JSON 전체를 붙여넣으세요:');
    if (!raw) return;
    try {
      // ```json ... ``` 블록 제거
      const cleaned = raw.replace(/```json\s*|\s*```/g, '').trim();
      const parsed = JSON.parse(cleaned);
      onUpdate({ ...item, bmc: { ...bmc, ...parsed } });
      onToast('✅ BMC 9블록 자동 입력 완료');
    } catch(err) { onToast('❌ JSON 파싱 실패: ' + err.message); }
  }

  function exportMD() {
    const md = bmcToMarkdown(item);
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safe = (item.what||'item').replace(/[\\/:*?"<>|]/g,'_').slice(0,40);
    a.href = url; a.download = `BMC-${safe}-${Date.now()}.md`;
    a.click(); URL.revokeObjectURL(url);
    onToast('📥 BMC 마크다운 다운로드');
  }

// BMC 블록 컴포넌트 (가이드 토글 기능 포함)
function BMCBlock({ block, value, onChange, guide, onToast }) {
  const [showGuide, setShowGuide] = useState(false);
  const [activeExample, setActiveExample] = useState(0);

  function useExample() {
    if (!guide) return;
    const text = guide.examples[activeExample].text;
    onChange(value ? value + '\n\n' + text : text);
    onToast('💡 예시 삽입됨 · 수정해서 당신 현실로');
    setShowGuide(false);
  }

  return (
    <div className={`${block.col} ${block.row} bg-gray-900 border border-gray-800 rounded-lg p-3 report-card flex flex-col`}>
      <div className="flex items-baseline justify-between mb-2">
        <div>
          <div className="font-bold text-sm">{block.title}</div>
          <div className="text-[10px] text-gray-500">{block.desc}</div>
        </div>
        {guide && (
          <button 
            onClick={() => setShowGuide(!showGuide)} 
            className="text-[10px] text-purple-400 hover:text-purple-300 no-print"
            title="가이드 보기">
            {showGuide ? '✕' : '💡 가이드'}
          </button>
        )}
      </div>

      {/* 가이드 토글 영역 */}
      {showGuide && guide && (
        <div className="mb-2 p-2 bg-purple-900/20 border border-purple-800 rounded text-[10px] no-print">
          <div className="text-purple-200 font-semibold mb-1">❓ {guide.question}</div>
          <div className="text-yellow-300 mb-2 text-[10px]">💡 Tip: {guide.tip}</div>
          
          <div className="flex gap-1 mb-2">
            {guide.examples.map((ex, i) => (
              <button key={i} onClick={() => setActiveExample(i)}
                className={`px-1.5 py-0.5 rounded text-[9px] ${
                  activeExample === i ? 'bg-purple-700 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                }`}>
                {ex.type}
              </button>
            ))}
          </div>
          
          <div className="bg-black/40 border border-purple-900/50 rounded p-2 text-gray-300 whitespace-pre-wrap leading-relaxed max-h-32 overflow-y-auto scrollbar">
            {guide.examples[activeExample].text}
          </div>
          
          <button onClick={useExample}
            className="mt-2 w-full py-1 bg-purple-700 hover:bg-purple-600 rounded text-[10px] text-white font-semibold">
            ✅ 이 예시 사용 (입력란에 자동 삽입)
          </button>
        </div>
      )}

      <IMETextarea value={value} onChange={onChange}
        placeholder={`${block.desc} 입력...`}
        className="w-full flex-1 bg-black/30 border border-gray-800 rounded p-2 text-xs resize-none scrollbar min-h-[80px]" />
    </div>
  );
}

// ═══ 리포트 뷰 ═══
function ReportView({ item, items, selectedId, setSelectedId, onBack, onToast }) {
  const activeItems = items.filter(i => i.status !== 'archived');
  const DAY_LABELS = { 1:'Day 1 · 시장 분석', 2:'Day 2 · 문제 우선순위', 6:'Day 3 · 경쟁자 약점', 3:'Day 4 · 오퍼 설계', 5:'Day 5 · 바이럴 콘텐츠', 4:'Day 6 · 유통 장악', 7:'Day 7 · 스케일 시스템' };

  function exportMarkdown() {
    if (!item) return;
    const date = new Date().toLocaleDateString('ko-KR');
    const progress = calcProgress(item);
    let md = `# 🦊 Tobis Growth OS — 검증 리포트\n\n`;
    md += `**아이템:** ${item.what || '(이름 없음)'}\n\n`;
    md += `| 항목 | 내용 |\n|------|------|\n`;
    md += `| 타겟 | ${item.target || '-'} |\n| 가격대 | ${item.price || '-'} |\n| 부당한 우위 | ${item.edge || '-'} |\n`;
    md += `| 진척률 | ${progress.done}/7 (${progress.pct}%) |\n| 최종 판결 | ${item.verdict || '미판결'} |\n`;
    md += `| 리포트 출력일 | ${date} |\n\n---\n\n`;
    for (const s of STEP_ORDER) {
      md += `## ${DAY_LABELS[s]}\n\n**분석 엔진:** ${STEPS[s].engine}\n\n`;
      md += item.results?.[s] ? `\`\`\`\n${item.results[s]}\n\`\`\`\n\n` : `> *(미실행)*\n\n`;
      md += `---\n\n`;
    }
    md += `## ⑧ Synthesizer · 최종 판결\n\n`;
    md += item.synthResult ? `\`\`\`\n${item.synthResult}\n\`\`\`\n\n` : `> *(미실행)*\n\n`;
    md += `\n---\n*생성: Tobis Growth OS · ${date}*\n`;
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safe = (item.what||'item').replace(/[\\/:*?"<>|]/g,'_').slice(0,40);
    a.href = url; a.download = `report-${safe}-${Date.now()}.md`;
    a.click(); URL.revokeObjectURL(url);
    onToast('📥 마크다운 다운로드');
  }
  function printPDF() { window.print(); }

  if (!item) {
    return (
      <div>
        <button onClick={onBack} className="text-sm text-gray-400 mb-4">← 뒤로</button>
        <h2 className="text-xl font-bold mb-4">📄 리포트</h2>
        <div className="text-center py-20 text-gray-600">
          <p>리포트를 볼 아이템을 선택하세요</p>
          <div className="max-w-md mx-auto mt-6 space-y-2">
            {activeItems.map(it => (
              <button key={it.id} onClick={()=>setSelectedId(it.id)} className="w-full text-left p-3 bg-gray-900 border border-gray-800 rounded hover:border-orange-500">
                <div className="font-semibold text-sm">{it.what||'이름없음'}</div>
                <div className="text-xs text-gray-500">{calcProgress(it).done}/7 · {it.verdict||'미판결'}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const progress = calcProgress(item);
  const verdictClass = item.verdict==='Go'?'verdict-go text-green-400':item.verdict==='Pivot'?'verdict-pivot text-yellow-400':item.verdict==='Kill'?'verdict-kill text-red-400':'text-gray-400';

  return (
    <div>
      <div className="flex items-center justify-between mb-4 no-print flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-sm text-gray-400 hover:text-white">← 뒤로</button>
          <select value={selectedId||''} onChange={e=>setSelectedId(e.target.value)} className="bg-gray-900 border border-gray-800 rounded px-3 py-1.5 text-sm">
            {activeItems.map(it => <option key={it.id} value={it.id}>{it.what||'이름없음'} ({calcProgress(it).done}/7)</option>)}
          </select>
        </div>
        <div className="flex gap-2">
          <button onClick={exportMarkdown} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-sm">📥 .md 다운로드</button>
          <button onClick={printPDF} className="px-3 py-1.5 bg-orange-600 hover:bg-orange-500 rounded text-sm font-semibold">🖨 PDF 출력</button>
        </div>
      </div>
      <div className="print-area max-w-4xl mx-auto">
        <div className="report-card bg-gradient-to-br from-orange-900/20 to-red-900/20 border border-orange-800 rounded-lg p-6 mb-6">
          <div className="text-xs text-gray-400 mb-2">🦊 Tobis Growth OS · 검증 리포트</div>
          <h1 className="text-3xl font-bold mb-4">{item.what || '(이름 없음)'}</h1>
          <div className="grid grid-cols-2 gap-3 text-sm mb-4">
            <div><span className="text-gray-500">타겟:</span> <b>{item.target||'-'}</b></div>
            <div><span className="text-gray-500">가격:</span> <b>{item.price||'-'}</b></div>
            <div><span className="text-gray-500">우위:</span> <b>{item.edge||'-'}</b></div>
            <div><span className="text-gray-500">출력일:</span> <b>{new Date().toLocaleDateString('ko-KR')}</b></div>
          </div>
          <div className="flex items-center gap-4 pt-4 border-t border-orange-900/50">
            <div><div className="text-xs text-gray-400">진척률</div><div className="text-xl font-bold">{progress.done}/7 ({progress.pct}%)</div></div>
            <div><div className="text-xs text-gray-400">최종 판결</div><div className={`text-xl font-bold ${verdictClass}`}>{item.verdict || '미판결'}</div></div>
          </div>
        </div>
        {STEP_ORDER.map((s) => {
          const step = STEPS[s];
          const hasResult = !!item.results?.[s];
          const phaseColor = PHASE_INFO[step.phase].color;
          return (
            <div key={s} className="report-card bg-gray-900 border border-gray-800 rounded-lg p-5 mb-4" style={{borderLeftWidth:'4px', borderLeftColor:phaseColor}}>
              <div className="flex items-center gap-3 mb-2">
                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${hasResult?'bg-green-700':'bg-gray-800'}`}>{hasResult?'✓':step.code}</div>
                <div className="flex-1">
                  <h2 className="font-bold text-lg">{DAY_LABELS[s]}</h2>
                  <p className="text-xs text-gray-400 italic">"{step.tagline}"</p>
                </div>
                <span className="text-xs text-gray-500">Phase {step.phase}</span>
              </div>
              <div className="text-xs text-gray-500 mb-3">⚙️ {step.engine}</div>
              {hasResult ? (
                <pre className="whitespace-pre-wrap text-sm bg-black/40 border border-gray-800 rounded p-3 font-mono leading-relaxed text-gray-200">{item.results[s]}</pre>
              ) : (
                <div className="text-sm text-gray-600 italic bg-black/20 border border-dashed border-gray-800 rounded p-3 text-center">— 미실행 —</div>
              )}
            </div>
          );
        })}
        <div className="report-card bg-gradient-to-br from-red-900/20 to-orange-900/20 border-2 border-orange-700 rounded-lg p-5 mb-4">
          <div className="flex items-center gap-3 mb-3">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${item.synthResult?'bg-orange-600':'bg-gray-800'}`}>{item.synthResult?'✓':'⑧'}</div>
            <div className="flex-1">
              <h2 className="font-bold text-lg">⑧ Synthesizer · 최종 통합 판결</h2>
              <p className="text-xs text-gray-400 italic">"7개 렌즈를 1개 결정으로 수렴한다"</p>
            </div>
            <span className={`text-sm font-bold ${verdictClass}`}>{item.verdict || '미판결'}</span>
          </div>
          {item.synthResult ? (
            <pre className="whitespace-pre-wrap text-sm bg-black/40 border border-orange-900/50 rounded p-3 font-mono leading-relaxed text-gray-200">{item.synthResult}</pre>
          ) : (
            <div className="text-sm text-gray-600 italic bg-black/20 border border-dashed border-gray-800 rounded p-3 text-center">— 미실행 —</div>
          )}
        </div>
      </div>
    </div>
  );
}

function HelpView({ onClose }) {
  return (
    <div className="max-w-3xl mx-auto">
      <button onClick={onClose} className="text-sm text-gray-400 mb-4">← 뒤로</button>
      <h2 className="text-2xl font-bold mb-4">📖 Tobis Growth OS v2.4</h2>
      <section className="mb-4 bg-gradient-to-br from-red-900/30 to-black border border-red-700 rounded p-4">
        <h3 className="font-bold mb-2">🎯 점수별 맞춤 피드백</h3>
        <ul className="text-sm space-y-1 text-gray-300 list-disc pl-5">
          <li><b>🔴 0~3점 (치명적)</b>: Day별 진단 + 3가지 액션 + Kill 리스크 + 재실행 버튼 제공</li>
          <li><b>🟡 4~6점 (개선)</b>: 구체 보완 항목 3개 제시</li>
          <li><b>🟢 7~8점 (양호)</b>: 다음 Day 진행</li>
          <li><b>⭐ 9~10점 (탁월)</b>: 경쟁 우위 활용 가이드</li>
          <li><b>Synth 치명 약점 요약</b>: 낮은 Day 자동 집계 + 피벗 방향 제시</li>
        </ul>
      </section>
      <section className="mb-4 bg-gradient-to-br from-purple-900/30 to-black border border-purple-700 rounded p-4">
        <h3 className="font-bold mb-2">🎯 Multiplicative-Floor Scoring</h3>
        <ul className="text-sm space-y-1 text-gray-300 list-disc pl-5">
          <li>각 Day에 0~10점 슬라이더 평가</li>
          <li>공식: (평균×0.6) + (최저값×0.4) × 10 = 총점</li>
          <li>치명적 약점 1개(3점 이하) → 자동 Kill 추천</li>
          <li>총점 75+ Go · 55~74 Pivot · 그 외 Kill</li>
        </ul>
      </section>
      <section className="mb-4 bg-gray-900 border border-gray-800 rounded p-4">
        <h3 className="font-bold mb-2">🔀 하이브리드 캔버스</h3>
        <ul className="text-sm space-y-1 text-gray-300 list-disc pl-5">
          <li><b>노드 드래그</b>: 자유 배치, 위치 자동 저장</li>
          <li><b>줌/팬</b>: 마우스 휠(줌) · 빈 공간 드래그(화면 이동)</li>
          <li><b>노드 클릭</b>: 우측 패널에서 프롬프트·답변·점수 편집</li>
        </ul>
      </section>
      <section className="mb-4 bg-gray-900 border border-gray-800 rounded p-4">
        <h3 className="font-bold mb-2">🎯 Scoring 사용법</h3>
        <ol className="text-sm space-y-1 text-gray-300 list-decimal pl-5">
          <li>Day 노드 클릭 → Claude 답변 붙여넣기</li>
          <li>답변 아래 <b>점수 슬라이더</b>에서 0~10점 평가</li>
          <li>Synthesizer 노드 클릭 → <b>자동 점수 대시보드</b> 확인</li>
          <li>7개 모두 평가하면 → <b>자동 추천 판결</b> 표시</li>
          <li>"→ 이 판결로 확정" 클릭 → 자동 적용</li>
        </ol>
      </section>
      <section className="mb-4 bg-gray-900 border border-gray-800 rounded p-4">
        <h3 className="font-bold mb-2">📋 BMC 사용법</h3>
        <ol className="text-sm space-y-1 text-gray-300 list-decimal pl-5">
          <li>상단 <b>📋 BMC</b> 탭 클릭</li>
          <li>수동 편집 or <b>🤖 자동 초안 프롬프트</b> 클릭</li>
          <li>Claude에 붙여넣기 → JSON 답변 받기</li>
          <li><b>📥 JSON 일괄 입력</b> 클릭 → 9블록 자동 채움</li>
          <li><b>🖨 PDF</b> 또는 <b>📥 .md 다운</b>로 내보내기</li>
        </ol>
      </section>
      <section className="mb-4 bg-gray-900 border border-gray-800 rounded p-4">
        <h3 className="font-bold mb-2">💾 데이터</h3>
        <p className="text-sm text-gray-300">IndexedDB 로컬 저장. 매일 자동 JSON 백업. 영구 무료.</p>
      </section>

      <section className="mb-4 bg-gray-900 border border-gray-800 rounded p-4 text-center">
        <a href="https://tobislab.com/" target="_blank" rel="noopener" className="text-xs text-gray-500 hover:text-gray-300 no-underline">
          Built by Tobis Lab
        </a>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
